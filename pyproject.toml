[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "titanic"
version = "0.1.0"
description = "Workspace package for the titanic ML experiments."
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0.3",
    "pyarrow>=25.0.0",
    "scikit-learn>=1.9.0",
    "skore[hub,jupyter]>=0.23.1",
    "skrub>=0.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
agent = [
    "ipython>=9.15.0",
    "pyright>=1.1.411",
]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]
